apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: bichos
  namespace: bichos
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: traefik
  rules:
    - host: bichos.lab.mateuseap.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: bichos
                port: { number: 80 }
  tls:
    - hosts: [bichos.lab.mateuseap.com]
      secretName: bichos-tls
