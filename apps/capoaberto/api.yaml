apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: capoaberto
spec:
  replicas: 1
  selector:
    matchLabels: { app: api }
  template:
    metadata:
      labels: { app: api }
    spec:
      imagePullSecrets:
        - name: ghcr-pull
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      # Apply pending migrations before the API starts, so the schema can
      # never fall behind the code it ships with (capoaberto #153).
      initContainers:
        - name: migrate
          image: ghcr.io/originlabsbr/capoaberto-api:a57fa8cac26ba38d15a96f6451269c06e224e256
          imagePullPolicy: IfNotPresent
          command: [/app/node_modules/.bin/node-pg-migrate, up, -m, migrations, -j, sql]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef: { name: capoaberto-db, key: DATABASE_URL }
          resources:
            requests: { cpu: 20m, memory: 64Mi }
            limits: { memory: 192Mi }
      containers:
        - name: api
          image: ghcr.io/originlabsbr/capoaberto-api:a57fa8cac26ba38d15a96f6451269c06e224e256
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
          ports: [{ containerPort: 3001 }]
          env:
            - { name: NODE_ENV, value: production }
            - { name: VEHICLE_PROVIDER_MODE, value: api-brasil }
            - name: API_BRASIL_BEARER_TOKEN
              valueFrom: { secretKeyRef: { name: capoaberto-api-brasil, key: API_BRASIL_BEARER_TOKEN } }
            # Encrypts the unparsed supplier answer at rest (admin raw download).
            - name: RAW_SUPPLIER_KEY
              valueFrom:
                secretKeyRef: { name: capoaberto-raw-vault, key: RAW_SUPPLIER_KEY }
            - name: DATABASE_URL
              valueFrom: { secretKeyRef: { name: capoaberto-db, key: DATABASE_URL } }
            - { name: PAYMENT_PROVIDER, value: asaas }
            - { name: ASAAS_ENV, value: production }
            - { name: ASAAS_USER_AGENT, value: capoaberto }
            - name: ASAAS_API_KEY
              valueFrom: { secretKeyRef: { name: capoaberto-asaas, key: ASAAS_API_KEY } }
            - name: ASAAS_WEBHOOK_AUTH_TOKEN
              valueFrom: { secretKeyRef: { name: capoaberto-asaas, key: ASAAS_WEBHOOK_AUTH_TOKEN } }
            - name: ABACATEPAY_API_KEY
              valueFrom: { secretKeyRef: { name: capoaberto-secrets, key: abacatepay-api-key } }
            - name: ABACATEPAY_WEBHOOK_SECRET
              valueFrom: { secretKeyRef: { name: capoaberto-secrets, key: abacatepay-webhook-secret } }
            - name: RESEND_API_KEY
              valueFrom: { secretKeyRef: { name: capoaberto-secrets, key: resend-api-key } }
            - name: EMAIL_FROM
              valueFrom: { secretKeyRef: { name: capoaberto-secrets, key: email-from } }
            - { name: EMAIL_REPLY_TO, value: contato@capoaberto.com.br }
            - { name: APP_URL, value: https://capoaberto.com.br }
            - { name: API_URL, value: http://api:3001 }
            - { name: ADMIN_EMAIL, value: mateuseap@mateuseap.com }
          resources:
            requests: { cpu: 20m, memory: 64Mi }
            limits: { memory: 192Mi }
          readinessProbe:
            httpGet: { path: /ready, port: 3001 }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: 3001 }
            initialDelaySeconds: 20
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: capoaberto
  labels: { app: api }
spec:
  selector: { app: api }
  ports: [{ name: http, port: 3001 }]
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: capoaberto-api
  namespace: capoaberto
  labels: { release: monitoring }
spec:
  selector:
    matchLabels: { app: api }
  endpoints:
    - { port: http, path: /metrics, interval: 60s }
  namespaceSelector:
    matchNames: [capoaberto]
