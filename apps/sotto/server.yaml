apiVersion: apps/v1
kind: Deployment
metadata:
  name: server
  namespace: sotto
spec:
  replicas: 1
  # A live session is a WebSocket holding an open upstream transcription
  # stream. Rolling a second pod alongside the old one would double the
  # concurrent stream count against a metered API, so replace instead.
  strategy: { type: Recreate }
  selector:
    matchLabels: { app: server }
  template:
    metadata:
      labels: { app: server }
    spec:
      imagePullSecrets:
        - name: ghcr-pull
      securityContext:
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: server
          image: ghcr.io/mateuseap/sotto-server:latest
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
          ports: [{ containerPort: 3001 }]
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "3001"
            # The browser talks to the client origin only: nginx proxies /api
            # onward, so the Origin header the server sees is the public host.
            - name: ALLOWED_ORIGINS
              value: https://sotto.lab.mateuseap.com
            # Each live session holds a paid upstream transcription stream, so
            # the cap is the backstop that keeps one caller from exhausting
            # both the credit and this single vCPU node.
            - name: MAX_SESSIONS
              value: "5"
            - name: DEEPGRAM_API_KEY
              valueFrom:
                secretKeyRef: { name: sotto-secrets, key: deepgram-api-key }
            # App-level login: bcrypt hash of the password set by the user,
            # committed as a LOGIN_PASSWORD_HASH SealedSecret (not present yet
            # here; sealed separately). App sets an httpOnly cookie on success,
            # replacing the Traefik BasicAuth + SESSION_TOKEN flow.
            - name: LOGIN_PASSWORD_HASH
              valueFrom:
                secretKeyRef: { name: sotto-secrets, key: login-password-hash }
          resources:
            requests: { cpu: 50m, memory: 120Mi }
            limits: { memory: 300Mi }
          readinessProbe:
            httpGet: { path: /api/health, port: 3001 }
            initialDelaySeconds: 5
          livenessProbe:
            httpGet: { path: /api/health, port: 3001 }
            initialDelaySeconds: 20
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  # Named `server` on purpose: the client nginx proxies /api to
  # http://server:3001 (same pattern as pixelhub).
  name: server
  namespace: sotto
  labels: { app: server }
spec:
  selector: { app: server }
  ports: [{ name: http, port: 3001 }]
