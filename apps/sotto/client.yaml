apiVersion: apps/v1
kind: Deployment
metadata:
  name: client
  namespace: sotto
spec:
  replicas: 1
  selector:
    matchLabels: { app: client }
  template:
    metadata:
      labels: { app: client }
      annotations:
        rollout-trigger: "2026-08-14T22:11:57Z"
    spec:
      imagePullSecrets:
        - name: ghcr-pull
      securityContext:
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: client
          image: ghcr.io/mateuseap/sotto-client:latest
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
          ports: [{ containerPort: 80 }]
          resources:
            requests: { cpu: 10m, memory: 24Mi }
            limits: { memory: 64Mi }
          readinessProbe:
            httpGet: { path: /, port: 80 }
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: client
  namespace: sotto
spec:
  selector: { app: client }
  ports: [{ port: 80 }]
