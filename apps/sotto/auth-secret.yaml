apiVersion: v1
kind: Secret
metadata:
  name: sotto-auth
  namespace: sotto
  labels: { app: sotto }
type: Opaque
stringData:
  # htpasswd bcrypt hash for Traefik BasicAuth. One-way: the password
  # cannot be recovered from this value, so it is safe in a public repo.
  # Generated with: htpasswd -nbBC 12 "" <password> | tr -d ':\n'
  users: sotto:$2b$12$n9TMYZrD.q0bv7qsRS8CIeu7T.MFM4x6fZWwz1wbiPIXOmB71lYc6
