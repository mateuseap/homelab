apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: tcc
  namespace: tcc
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: traefik
  rules:
    - host: tcc.lab.mateuseap.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: site
                port: { number: 80 }
  tls:
    - hosts: [tcc.lab.mateuseap.com]
      secretName: tcc-tls
