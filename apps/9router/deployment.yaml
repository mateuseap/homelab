apiVersion: apps/v1
kind: Deployment
metadata:
  name: 9router
  namespace: 9router
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app: 9router }
  template:
    metadata:
      labels: { app: 9router }
    spec:
      securityContext:
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: 9router
          # Third-party image on Docker Hub, not built by this user's own
          # CI. Pin the multi-platform v0.5.95 image index so deploys are
          # reproducible and upgrades remain explicit and reviewable.
          image: decolua/9router@sha256:4316fefb95ea642d57db885d906b1227b1768b15ac5def314621fd781da7b3f1
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            # decolua/9router's entrypoint runs as root and uses su-exec to
            # drop to a lower-privileged user, which needs SETUID/SETGID.
            # Dropping ALL without adding these back leaves the container
            # crashlooping on "su-exec: setgroups: Operation not permitted".
            capabilities: { drop: [ALL], add: [SETUID, SETGID] }
          ports: [{ containerPort: 20128 }]
          env:
            - name: NODE_ENV
              value: production
            - name: DATA_DIR
              value: /data
            - name: PORT
              value: "20128"
            - name: REQUIRE_API_KEY
              value: "true"
            - name: AUTH_COOKIE_SECURE
              value: "true"
            - name: ENABLE_REQUEST_LOGS
              value: "false"
            # Allow long first-token and reasoning gaps without aborting streams.
            - name: FETCH_CONNECT_TIMEOUT_MS
              value: "300000"
            - name: STREAM_FIRST_CHUNK_TIMEOUT_MS
              value: "300000"
            - name: STREAM_STALL_TIMEOUT_MS
              value: "900000"
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef: { name: 9router-secrets, key: jwt-secret }
            - name: INITIAL_PASSWORD
              valueFrom:
                secretKeyRef: { name: 9router-secrets, key: initial-password }
            - name: API_KEY_SECRET
              valueFrom:
                secretKeyRef: { name: 9router-secrets, key: api-key-secret }
            - name: MACHINE_ID_SALT
              valueFrom:
                secretKeyRef: { name: 9router-secrets, key: machine-id-salt }
          resources:
            requests: { cpu: 50m, memory: 150Mi }
            limits: { memory: 512Mi }
          readinessProbe:
            tcpSocket: { port: 20128 }
            initialDelaySeconds: 5
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: 9router-data }
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: 9router-data
  namespace: 9router
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests: { storage: 5Gi }
