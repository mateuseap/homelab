apiVersion: apps/v1
kind: Deployment
metadata:
  name: fj-presentation
  namespace: fj-presentation
spec:
  replicas: 1
  selector:
    matchLabels: { app: fj-presentation }
  template:
    metadata:
      labels: { app: fj-presentation }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
        seccompProfile: { type: RuntimeDefault }
      initContainers:
        - name: fetch-presentation
          image: curlimages/curl:8.12.1
          command: [/bin/sh, -ec]
          args:
            - |
              curl --fail --location --silent --show-error \
                https://github.com/mateuseap/compilers/archive/1948df1c507e9cf071b4978a0f90fd7a1c02c3af.tar.gz \
                | tar -xz --strip-components=3 \
                    -C /site \
                    compilers-1948df1c507e9cf071b4978a0f90fd7a1c02c3af/seminario-featherweight-java/apresentacao
              test -f /site/index.html
              test -f /site/assets/tapl-fig19-3.png
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
            readOnlyRootFilesystem: true
          resources:
            requests: { cpu: 5m, memory: 8Mi }
            limits: { memory: 32Mi }
          volumeMounts:
            - { name: site, mountPath: /site }
            - { name: tmp, mountPath: /tmp }
      containers:
        - name: nginx
          image: nginxinc/nginx-unprivileged:1.27-alpine
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
            readOnlyRootFilesystem: true
          ports:
            - { name: http, containerPort: 8080 }
          resources:
            requests: { cpu: 5m, memory: 8Mi }
            limits: { memory: 32Mi }
          readinessProbe:
            httpGet: { path: /index.html, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /index.html, port: http }
            initialDelaySeconds: 10
            periodSeconds: 30
          volumeMounts:
            - { name: site, mountPath: /usr/share/nginx/html, readOnly: true }
            - { name: nginx-cache, mountPath: /var/cache/nginx }
            - { name: nginx-run, mountPath: /var/run }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - { name: site, emptyDir: {} }
        - { name: nginx-cache, emptyDir: {} }
        - { name: nginx-run, emptyDir: {} }
        - { name: tmp, emptyDir: {} }
