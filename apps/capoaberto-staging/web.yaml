apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: capoaberto-staging
spec:
  replicas: 1
  selector:
    matchLabels: { app: web }
  template:
    metadata:
      labels: { app: web }
    spec:
      imagePullSecrets:
        - name: ghcr-pull
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: web
          image: ghcr.io/originlabsbr/capoaberto-web:f0ca57a65ec5125257852d02d74d35e40f8c5063
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
          ports: [{ containerPort: 3000 }]
          env:
            - name: NEXT_PUBLIC_ENV
              value: staging
            # Cloudflare's always-pass Turnstile test key: staging never
            # challenges and never counts against the production widget.
            - name: TURNSTILE_SITE_KEY
              value: 1x00000000000000000000AA
            # Server components render on the pod, so they need the in-cluster
            # API address. Without it the default localhost target is refused.
            - name: API_URL
              value: http://api:3001
          resources:
            requests: { cpu: 20m, memory: 64Mi }
            limits: { memory: 192Mi }
          readinessProbe:
            httpGet: { path: /api/health, port: 3000 }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /api/health, port: 3000 }
            initialDelaySeconds: 20
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: capoaberto-staging
spec:
  selector: { app: web }
  ports: [{ name: http, port: 3000 }]
