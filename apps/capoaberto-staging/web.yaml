apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: capoaberto-staging
spec:
  replicas: 1
  selector:
    matchLabels: { app: web }
  template:
    metadata:
      labels: { app: web }
    spec:
      imagePullSecrets:
        - name: ghcr-pull
      securityContext:
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: web
          image: ghcr.io/originlabsbr/capoaberto-web:4256b3e0bffc6c4fa6056de67419968aadfd42bb
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
          ports: [{ containerPort: 3000 }]
          env:
            - name: NEXT_PUBLIC_ENV
              value: staging
          resources:
            requests: { cpu: 20m, memory: 64Mi }
            limits: { memory: 192Mi }
          readinessProbe:
            httpGet: { path: /api/health, port: 3000 }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /api/health, port: 3000 }
            initialDelaySeconds: 20
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: capoaberto-staging
spec:
  selector: { app: web }
  ports: [{ name: http, port: 3000 }]
