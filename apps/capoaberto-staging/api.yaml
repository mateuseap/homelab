apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: capoaberto-staging
spec:
  replicas: 1
  selector:
    matchLabels: { app: api }
  template:
    metadata:
      labels: { app: api }
    spec:
      imagePullSecrets:
        - name: ghcr-pull
      securityContext:
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: api
          image: ghcr.io/originlabsbr/capoaberto-api:b6eaea7f7b8530acb5e78152382488cf1cda66d0
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
          ports: [{ containerPort: 3001 }]
          env:
            - name: NODE_ENV
              value: production
            - name: VEHICLE_PROVIDER_MODE
              value: mock
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef: { name: capoaberto-db, key: DATABASE_URL }
            - name: ABACATEPAY_API_KEY
              valueFrom: { secretKeyRef: { name: capoaberto-secrets, key: abacatepay-api-key } }
            - name: ABACATEPAY_WEBHOOK_SECRET
              valueFrom: { secretKeyRef: { name: capoaberto-secrets, key: abacatepay-webhook-secret } }
            - name: RESEND_API_KEY
              valueFrom: { secretKeyRef: { name: capoaberto-secrets, key: resend-api-key } }
            - name: EMAIL_FROM
              valueFrom: { secretKeyRef: { name: capoaberto-secrets, key: email-from } }
            - name: APP_URL
              value: https://capoaberto.lab.mateuseap.com
            - name: API_URL
              value: http://api:3001
          resources:
            requests: { cpu: 20m, memory: 64Mi }
            limits: { memory: 192Mi }
          readinessProbe:
            httpGet: { path: /ready, port: 3001 }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: 3001 }
            initialDelaySeconds: 20
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: capoaberto-staging
spec:
  selector: { app: api }
  ports: [{ name: http, port: 3001 }]
