apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: capoaberto-staging
spec:
  replicas: 1
  selector:
    matchLabels: { app: api }
  template:
    metadata:
      labels: { app: api }
    spec:
      imagePullSecrets:
        - name: ghcr-pull
      securityContext:
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: api
          image: ghcr.io/originlabsbr/capoaberto-api:de54f166a5c9ce224be63cd3b269128d5b6f7281
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
          ports: [{ containerPort: 3001 }]
          env:
            - name: NODE_ENV
              value: production
            - name: VEHICLE_PROVIDER_MODE
              value: mock
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef: { name: capoaberto-db, key: DATABASE_URL }
          resources:
            requests: { cpu: 20m, memory: 64Mi }
            limits: { memory: 192Mi }
          readinessProbe:
            httpGet: { path: /ready, port: 3001 }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: 3001 }
            initialDelaySeconds: 20
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: capoaberto-staging
spec:
  selector: { app: api }
  ports: [{ name: http, port: 3001 }]
