apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: capoaberto-staging
spec:
  replicas: 1
  selector:
    matchLabels: { app: api }
  template:
    metadata:
      labels: { app: api }
    spec:
      imagePullSecrets:
        - name: ghcr-pull
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      # Apply pending migrations before the API starts, so the schema can
      # never fall behind the code it ships with (capoaberto #153).
      initContainers:
        - name: migrate
          image: ghcr.io/originlabsbr/capoaberto-api:8acfb6d24d9be324e4a4f7597ee10cf633b15319
          imagePullPolicy: IfNotPresent
          command: [/app/node_modules/.bin/node-pg-migrate, up, -m, migrations, -j, sql]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef: { name: capoaberto-db, key: DATABASE_URL }
          resources:
            requests: { cpu: 20m, memory: 64Mi }
            limits: { memory: 192Mi }
      containers:
        - name: api
          image: ghcr.io/originlabsbr/capoaberto-api:8acfb6d24d9be324e4a4f7597ee10cf633b15319
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
          ports: [{ containerPort: 3001 }]
          env:
            - name: NODE_ENV
              value: production
            # Sandbox sends the supplier's homolog flag: it exercises the real
            # request path against real modules, returns fixed data, and is
            # neither billed nor counted against the account balance.
            - name: VEHICLE_PROVIDER_MODE
              value: api-brasil-sandbox
            - name: API_BRASIL_BEARER_TOKEN
              valueFrom:
                secretKeyRef: { name: capoaberto-api-brasil, key: API_BRASIL_BEARER_TOKEN }
            # Encrypts the unparsed supplier answer at rest (admin raw download).
            - name: RAW_SUPPLIER_KEY
              valueFrom:
                secretKeyRef: { name: capoaberto-raw-vault, key: RAW_SUPPLIER_KEY }
            - name: TURNSTILE_SECRET_KEY
              valueFrom: { secretKeyRef: { name: capoaberto-turnstile, key: TURNSTILE_SECRET_KEY } }
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef: { name: capoaberto-db, key: DATABASE_URL }
            # Asaas is the active gateway in staging; AbacatePay stays in the
            # build so a rollback is this value plus a restart.
            - name: PAYMENT_PROVIDER
              value: asaas
            - name: ASAAS_ENV
              value: sandbox
            - name: ASAAS_USER_AGENT
              value: capoaberto
            - name: ASAAS_API_KEY
              valueFrom:
                secretKeyRef: { name: capoaberto-asaas, key: ASAAS_API_KEY }
            - name: ASAAS_WEBHOOK_AUTH_TOKEN
              valueFrom:
                secretKeyRef: { name: capoaberto-asaas, key: ASAAS_WEBHOOK_AUTH_TOKEN }
            - name: ABACATEPAY_API_KEY
              valueFrom: { secretKeyRef: { name: capoaberto-secrets, key: abacatepay-api-key } }
            - name: ABACATEPAY_WEBHOOK_SECRET
              valueFrom: { secretKeyRef: { name: capoaberto-secrets, key: abacatepay-webhook-secret } }
            - name: RESEND_API_KEY
              valueFrom: { secretKeyRef: { name: capoaberto-secrets, key: resend-api-key } }
            - name: EMAIL_FROM
              valueFrom: { secretKeyRef: { name: capoaberto-secrets, key: email-from } }
            # Transactional mail is sent from a noreply address, so without
            # this a reply to a report reaches a mailbox nobody reads. Not a
            # secret: the address is published on the site.
            - name: EMAIL_REPLY_TO
              value: contato@capoaberto.com.br
            - name: APP_URL
              value: https://staging.capoaberto.com.br
            - name: API_URL
              value: http://api:3001
            # Exact account allowed to bootstrap the admin role after a clean
            # environment reset. All other registrations remain regular users.
            - name: ADMIN_EMAIL
              value: mateuseap@mateuseap.com
          resources:
            requests: { cpu: 20m, memory: 64Mi }
            limits: { memory: 192Mi }
          readinessProbe:
            httpGet: { path: /ready, port: 3001 }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: 3001 }
            initialDelaySeconds: 20
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: capoaberto-staging
  # The ServiceMonitor selects Services by their own labels, not by the pods
  # they route to, so this label is what makes the scrape target exist.
  labels: { app: api }
spec:
  selector: { app: api }
  ports: [{ name: http, port: 3001 }]
---
# Prometheus scrapes /metrics from inside the cluster. The ingress never routes
# to it, so the endpoint stays private while Prometheus still reaches it.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: capoaberto-api
  namespace: capoaberto-staging
  labels:
    release: monitoring
spec:
  selector:
    matchLabels: { app: api }
  endpoints:
    - port: http
      path: /metrics
      interval: 60s
  namespaceSelector:
    matchNames: [capoaberto-staging]
