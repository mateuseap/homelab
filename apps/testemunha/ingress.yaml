apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: testemunha
  namespace: testemunha
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: traefik
  rules:
    - host: testemunha.lab.mateuseap.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: testemunha
                port: { number: 80 }
  tls:
    - hosts: [testemunha.lab.mateuseap.com]
      secretName: testemunha-tls
