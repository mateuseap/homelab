apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: fantasma
  namespace: fantasma
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: traefik
  rules:
    - host: fantasma.lab.mateuseap.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: fantasma
                port: { number: 80 }
  tls:
    - hosts: [fantasma.lab.mateuseap.com]
      secretName: fantasma-tls
