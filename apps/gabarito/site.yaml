apiVersion: apps/v1
kind: Deployment
metadata:
  name: gabarito
  namespace: gabarito
spec:
  replicas: 1
  selector:
    matchLabels: { app: gabarito }
  template:
    metadata:
      labels: { app: gabarito }
    spec:
      securityContext:
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: gabarito
          image: ghcr.io/mateuseap/gabarito:latest
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
          ports: [{ containerPort: 80 }]
          resources:
            requests: { cpu: 10m, memory: 24Mi }
            limits: { memory: 64Mi }
          readinessProbe:
            httpGet: { path: /, port: 80 }
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: gabarito
  namespace: gabarito
spec:
  selector: { app: gabarito }
  ports: [{ port: 80 }]
