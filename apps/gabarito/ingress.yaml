# Plain HTTP answered 200 instead of redirecting, so browsers that reached the site
# over http:// showed "Not secure". RedirectScheme leaves https requests untouched,
# and the cert-manager HTTP-01 solver uses its own Ingress, so renewals keep working.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: https-redirect
  namespace: gabarito
spec:
  redirectScheme:
    scheme: https
    permanent: true
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gabarito
  namespace: gabarito
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.middlewares: gabarito-https-redirect@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - host: gabarito.lab.mateuseap.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: gabarito
                port: { number: 80 }
  tls:
    - hosts: [gabarito.lab.mateuseap.com]
      secretName: gabarito-tls
