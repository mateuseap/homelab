apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: forja-mundo
  namespace: forja-mundo
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: traefik
  rules:
    - host: forja-mundo.lab.mateuseap.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: forja-mundo
                port: { number: 80 }
  tls:
    - hosts: [forja-mundo.lab.mateuseap.com]
      secretName: forja-mundo-tls
