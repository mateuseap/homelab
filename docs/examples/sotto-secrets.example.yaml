# Template for the Sotto secret. Fill in real values, seal it, and commit only
# the sealed output. Never commit this file with values filled in.
#
#   kubeseal --controller-namespace kube-system \
#     --format yaml < /tmp/sotto-secrets.yaml > apps/sotto/sealed-secrets.yaml
#   shred -u /tmp/sotto-secrets.yaml
#
apiVersion: v1
kind: Secret
metadata:
  name: sotto-secrets
  namespace: sotto
type: Opaque
stringData:
  # Deepgram streaming API key from https://console.deepgram.com
  # The signup credit is 200 USD with no credit card, roughly 690 hours.
  deepgram-api-key: CHANGE-ME

  # Shared secret gating the session WebSocket upgrade. An Origin header is
  # trivially forged, so on a public ingress this is the real gate.
  # Generate with: openssl rand -hex 32
  #
  # It must match VITE_SESSION_TOKEN, which is baked into the client bundle at
  # image build time. That value lives as a repository secret on
  # github.com/mateuseap/sotto, where the publish workflow passes it to the
  # client image build. Changing this value means updating that secret and
  # rebuilding the client image, not just resealing here.
  session-token: CHANGE-ME
