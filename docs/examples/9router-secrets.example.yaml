# TEMPLATE, never commit filled-in copies of this file (see .gitignore).
# Lives in docs/ (NOT apps/) because ArgoCD applies every YAML under apps/, so
# a template there would be deployed literally and fight the sealed secret.
#
# Workflow (details in docs/RUNBOOK.md section Secrets):
#   1. cp docs/examples/9router-secrets.example.yaml /tmp/secrets.yaml
#   2. fill in real values, e.g.:
#        jwt-secret:       openssl rand -base64 48 | tr -d '\n'
#        initial-password: openssl rand -base64 24 | tr -d '\n'
#        api-key-secret:   openssl rand -hex 32
#        machine-id-salt:  openssl rand -hex 32
#   3. kubeseal --controller-namespace kube-system --format yaml \
#        < /tmp/secrets.yaml > apps/9router/sealed-secrets.yaml
#   4. commit apps/9router/sealed-secrets.yaml (safe: only the cluster can decrypt it)
#   5. shred -u /tmp/secrets.yaml
apiVersion: v1
kind: Secret
metadata:
  name: 9router-secrets
  namespace: 9router
stringData:
  jwt-secret: CHANGE-ME
  initial-password: CHANGE-ME
  api-key-secret: CHANGE-ME
  machine-id-salt: CHANGE-ME
